version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # @opencode/theme pins @opentui/core to an exact version. Bumping one without the other installs two copies and fails the type-aware lint.
      opencode-host:
        patterns:
          - '@opencode/*'
          - '@opentui/*'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # @opentui/solid still requires solid-js 1.x (#60).
      - dependency-name: solid-js
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
