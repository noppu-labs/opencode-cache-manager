name: release

# Pushing a `v*` tag tests and packs the ship set, then publishes it to npm
# via OIDC trusted publishing -- no npm token is stored anywhere -- under
# both package names, then creates a GitHub Release. Manual dispatch
# retries an existing tag without moving it. Re-runs are idempotent:
# name@version pairs already on npm are skipped (no 409s on re-tagged or
# re-dispatched releases), and an existing GitHub Release only gets its
# checksum asset refreshed.
#
# Prerequisites (configure once each, outside this repo):
#   - npm trusted publishers for BOTH package names, each pointing at
#     GitHub Actions, repository noppu-labs/opencode-cache-manager,
#     workflow `release.yml`, no environment:
#       - @noppu-labs/opencode-cache-manager (owned by the noppu-labs org)
#       - opencode-cache-manager (owned by the publishing user)
#   - Actions → General → "Workflow permissions" allows id-token writes
#     (required for OIDC publishing and npm --provenance).
#   - A repository ruleset protecting `v*` tags ( restricting
#     tag creation/update/deletion to maintainers), since whoever controls
#     a tagged commit controls these guards.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions: {}

jobs:
  quality:
    name: test and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/

  build:
    needs: quality
    name: pack and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # History for the tag ancestry check.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Verify tag (gate)
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]
          git merge-base --is-ancestor HEAD origin/main
          pkg_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + package.json version $pkg_version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - name: Read tag metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # Pack and verify the ship set against the real tarball that will be
      # published.
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ]
          CACHE_MANAGER_TEST_TARBALL="$PWD/$1" bun test tests/package-smoke.test.ts
          echo "##[group]Tarball contents"
          tar -tzf artifacts/*.tgz | sort
          echo "##[endgroup]"

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum *.tgz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifact
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: build
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `gh release --target main` needs the repo, but no credentials
          # are persisted after this step.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Re-verify tag still points at this commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: artifacts

      # Integrity handoff: the artifact must still match the checksum
      # generated next to the build, byte for byte.
      - name: Verify artifact checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum --check checksums-sha256.txt

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; Node 24
      # bundles a new enough npm. npm exchanges the job's OIDC token itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Publish the exact verified artifact under the scoped name, then
      # the same artifact under the unscoped name. Each name is guarded:
      # if it already has this version on npm (a re-run of a finished
      # release, or a partial failure being retried), the publish for
      # that name is skipped instead of dying with E409.
      - name: Publish to npm (both names)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ]
          if npm view "@noppu-labs/opencode-cache-manager@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@noppu-labs/opencode-cache-manager@$VERSION is already on npm; skipping scoped publish"
          else
            npm publish "./$1" --provenance --access public --tag latest
          fi
          rm -rf publish-dir && mkdir publish-dir
          tar -xzf "$1" -C publish-dir --strip-components=1
          if npm view "opencode-cache-manager@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::opencode-cache-manager@$VERSION is already on npm; skipping unscoped publish"
          else
            (
              cd publish-dir
              npm pkg set name=opencode-cache-manager
              npm publish . --provenance --access public --tag latest
            )
          fi

      # Also idempotent: on a re-run the release already exists, so only
      # the checksum asset is refreshed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag release already exists; refreshing checksums only"
          else
            gh release create "$tag" --title "$tag" --target main --generate-notes
          fi
          gh release upload "$tag" artifacts/checksums-sha256.txt --clobber