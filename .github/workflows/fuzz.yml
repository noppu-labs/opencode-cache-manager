name: fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deep fuzz with 10x the per-PR run count.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    name: fast-check property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Fuzz property tests (fast-check, high run count)
        run: bun run fuzz
        env:
          FC_NUM_RUNS: ${{ github.event_name == 'schedule' && '10000' || '1000' }}
